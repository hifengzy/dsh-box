<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:"
    />
    <title>DSH Desktop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 启动加载页:全屏黑色。
         logo:宽度为窗口 50%,顶部边缘距窗口顶部 30%,水平居中。
         loading:logo 下方 30px 居中(动画 + 文案,含动态端口)。
         error:logo 下方 100px 居中;重试按钮固定在窗口底部。 -->
    <div class="hero">
      <img class="logo" src="./logo-home.svg" alt="DSH Desktop" draggable="false" />
      <div class="loading" id="loading">
        <div class="spinner" aria-label="加载中"></div>
        <p class="loading-text" id="loadingText">服务启动中…</p>
      </div>
      <div class="error" id="error" hidden>
        <p class="error-title">服务启动失败</p>
        <pre class="error-detail" id="errorDetail"></pre>
      </div>
    </div>

    <button class="retry" id="retryBtn" hidden>重试</button>

    <script src="./renderer.js"></script>
  </body>
</html>
