<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:"
    />
    <title>服务状态</title>
    <link rel="stylesheet" href="./dsh-status.css" />
  </head>
  <body>
    <!--
      服务状态面板(右侧内置,开关由顶栏状态按钮/菜单控制,自身无关闭按钮)。
      布局参考设计稿(正常/停止/查询失败三态):
        [服务状态]
          DSH 0.1.0-rc.6...        [● 运行中] (+启动服务, 停止时)
          端口 3260 · PID 33990
        ───────────────────────────
        [DSH 版本]
          [卡片] 0.1.0-rc.8 [最新]            [更新]
                 2026-08-19
          [卡片] ...
          [更多] / [网络服务异常] [重试]
    -->
    <main class="content">
      <!-- ---------- 服务状态 ---------- -->
      <section class="section" id="serviceSection">
        <h1 class="section-title">服务状态</h1>
        <div class="status-info">
          <div class="status-text">
            <div class="version-line" id="versionLine" title="">DSH 1.0.0</div>
            <div class="meta-line" id="metaLine">端口 - · PID -</div>
          </div>
          <div class="status-side">
            <span class="state-pill" id="statePill">
              <span class="state-dot" id="stateDot"></span>
              <span class="state-label" id="stateLabel">运行中</span>
            </span>
            <button class="btn btn-primary" id="startBtn" type="button" hidden>启动服务</button>
          </div>
        </div>
        <div class="hint-line" id="serviceHint" hidden></div>
      </section>

      <!-- ---------- DSH 版本 ---------- -->
      <section class="section" id="versionSection">
        <h1 class="section-title">DSH 版本</h1>

        <div class="version-list" id="versionList"></div>

        <!-- 查询失败:错误文案 + 重试 -->
        <div class="version-error" id="versionError" hidden>
          <p class="error-text">网络服务异常</p>
          <button class="btn btn-outline" id="retryBtn" type="button">重试</button>
        </div>

        <!-- 缓存回退提示(网络失败但展示上次缓存) -->
        <div class="cache-note" id="cacheNote" hidden>网络异常,以下为上次缓存结果</div>

        <!-- 更多:一次加载 10 条,到底隐藏 -->
        <button class="btn btn-outline btn-more" id="moreBtn" type="button" hidden>更多</button>

        <div class="hint-line" id="upgradeHint" hidden></div>
      </section>
    </main>

    <script src="./dsh-status.js"></script>
  </body>
</html>
