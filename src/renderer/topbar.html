<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data: file:"
    />
    <title>TitleBar</title>
    <link rel="stylesheet" href="./topbar.css" />
  </head>
  <body>
    <!--
      自定义顶栏:整条可拖动窗口。左侧约 80px 留给 macOS 红绿灯,
      不要在那里放可交互元素。右侧 .actions 放功能入口(GitHub 仓库 /
      应用更新「新版本」/ 服务状态入口 / 底部面板 / 侧边栏 两个面板开关),
      已加 no-drag,保证可点击。
      按钮从左至右:应用更新(仅出现时)、github、管理(服务状态)、底部面板、侧边栏;
      悬停 tooltips 依次为:github / 管理 / 底部面板 / 侧边栏(更新按钮文案即状态)。
      「新版本」按钮在 github 左侧,与其保持 ≥30px 间距(仅下载/安装流程中显示,
      隐藏时不留空位)。
      应用名不在顶栏展示(红绿灯右侧留白)。
    -->
    <div class="bar">
      <div class="actions">
        <!-- 应用自更新:有新版时出现 github 左侧。「新版本」(发现) → 下载中 n%(背景涂色)
             → 安装(下载完成) → 安装中…;错误 → 重试。点击按状态推进。 -->
        <button
          class="app-update-btn"
          id="appUpdateBtn"
          type="button"
          hidden
        >
          <span class="app-update-fill" id="appUpdateFill" aria-hidden="true"></span>
          <span class="app-update-label" id="appUpdateLabel">新版本</span>
        </button>
        <!-- GitHub 仓库:点击在系统浏览器打开仓库页 -->
        <button
          class="github-btn"
          id="githubBtn"
          type="button"
          aria-label="GitHub 仓库"
          title="github"
        >
          <span class="github-icon" aria-hidden="true"></span>
        </button>
        <!-- dsh 服务与版本入口:点击打开状态页;有可升级版本时右上角亮红点 -->
        <button
          class="status-btn"
          id="statusBtn"
          type="button"
          aria-label="dsh 服务与版本"
          title="管理"
        >
          <span class="status-icon" aria-hidden="true"></span>
          <span class="status-dot" id="updateDot" hidden aria-hidden="true"></span>
        </button>
        <!-- 侧边栏插件(dsh-better-sidebar)的两个面板开关:经桥切换页面内的底栏/侧栏;
             插件未安装时禁用,开合状态随页面实时回显 -->
        <button
          class="panel-btn"
          id="pluginBottomBtn"
          type="button"
          aria-label="展开/折叠底部面板"
          title="底部面板"
          disabled
        >
          <span class="panel-icon panel-icon-bottom" aria-hidden="true"></span>
        </button>
        <button
          class="panel-btn"
          id="pluginSideBtn"
          type="button"
          aria-label="展开/折叠侧边栏"
          title="侧边栏"
          disabled
        >
          <span class="panel-icon panel-icon-side" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <script src="./topbar.js"></script>
  </body>
</html>
