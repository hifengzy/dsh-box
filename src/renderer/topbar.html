<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data: file:"
    />
    <title>TitleBar</title>
    <link rel="stylesheet" href="./topbar.css" />
  </head>
  <body>
    <!--
      自定义顶栏:整条可拖动窗口。左侧约 80px 留给 macOS 红绿灯,
      不要在那里放可交互元素。右侧 .actions 放功能入口(当前:GitHub 仓库
      按钮),已加 no-drag,保证可点击。应用名不在顶栏展示(红绿灯右侧留白)。
    -->
    <div class="bar">
      <div class="actions">
        <button
          class="github-btn"
          id="githubBtn"
          type="button"
          aria-label="GitHub 仓库"
          title="GitHub 仓库"
        >
          <span class="github-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <script src="./topbar.js"></script>
  </body>
</html>
