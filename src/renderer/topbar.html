<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:"
    />
    <title>TitleBar</title>
    <link rel="stylesheet" href="./topbar.css" />
  </head>
  <body>
    <!--
      自定义顶栏:整条可拖动窗口。左侧约 80px 留给 macOS 红绿灯,
      不要在那里放可交互元素。右侧 .actions 是将来放功能入口的地方
      (搜索框、按钮等),已加 no-drag,保证可点击。
    -->
    <div class="bar">
      <span class="title">DSH Desktop</span>
      <div class="actions">
        <!-- 将来的功能入口加在这里,例如:
             <input class="search" type="text" placeholder="搜索…" /> -->
        <span class="placeholder">功能入口区域</span>
      </div>
    </div>

    <script src="./topbar.js"></script>
  </body>
</html>
